[project]
name = "GoRoutes_BackEnd"
version = "0.1.0"
description = "GoRoutes Backend"
authors = [
    {name = "AnthonyLoche", email = "anthonylocheifc@gmail.com"},
    {name = "jonatasperaza", email = "jonatassilvaperaza@gmail.com"},
]
dependencies = [
    "django>=5.1.7", 
    "djangorestframework>=3.16.0", 
    "drf-spectacular>=0.28.0", 
    "python-dotenv>=1.1.0", 
    "django-cors-headers>=4.7.0", 
    "Pillow>=11.2.1",
    "passage-identity>=2.5.0",
    "django-extensions>=4.1",
    "pydotplus>=2.0.2",
    "faker>=37.3.0",
    "djangorestframework-simplejwt>=5.5.0",
    "dj-database-url>=3.0.0",
    "psycopg2-binary>=2.9.10",
    "uvicorn>=0.35.0",
  "whitenoise[brotli]>=6.6.0",
  "gunicorn>=21.2.0",
  "django-filter>=25.1",
  "typing>=3.7.4.3",
  "numpy>=2.3.1",
  "scikit-learn>=1.7.0",
  "cloudinary>=1.44.1",
  "channels>=4.3.0",
  "channels-redis>=4.3.0",
  "daphne>=4.2.1",
  "websockets>=15.0.1",
  "wsproto>=1.2.0",
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[[tool.pdm.autoexport]]
filename = "requirements.txt"
without-hashes = "true"

[tool.ruff]
line-length = 120
extend-exclude = ['migrations', '__init__.py', 'manage.py']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ["PLR6301"]

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pdm.scripts]
dev = "python manage.py runserver"
devweb = "pdm run uvicorn config.asgi:application --reload --port 8000"
runserver = "python manage.py runserver"
createsuperuser = "python manage.py createsuperuser"
pre_migrate = "python manage.py makemigrations"
migrate = "python manage.py migrate"
shell = "python manage.py shell"
test = "python manage.py test"
startapp = "python manage.py startapp {args}"
loaddata = "python manage.py loaddata {args}"
dumpdata = "python manage.py dumpdata {args}"
model = "python manage.py graph_models -a -g -o models.png"
populate = "python manage.py populate_all"
req = "pdm export -f requirements --without-hashes -o requirements.txt"
check = "ruff check"
pre_format = "ruff check --fix"
format = "ruff format"
migrate_db = "python manage.py migrate_db"

[dependency-groups]
dev = [
    "pylint>=3.3.6",
    "ipython>=9.0.2",
    "ruff>=0.11.2",
]